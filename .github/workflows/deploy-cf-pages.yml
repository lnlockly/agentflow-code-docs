name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cf-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro Starlight
        run: npm run build

      - name: Sanity-check llms-full.txt size
        run: |
          if [ ! -f dist/llms-full.txt ]; then
            echo "::error::dist/llms-full.txt missing — starlight-llms-txt plugin failed."
            exit 1
          fi
          size=$(wc -c < dist/llms-full.txt)
          echo "llms-full.txt size: $size bytes"
          if [ "$size" -lt 30000 ]; then
            echo "::error::llms-full.txt is under 30KB — likely missing content."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: agentflow-code-docs
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.head_ref || github.ref_name }}
