name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Sanity check llms-full.txt size
        run: |
          if [ ! -f dist/llms-full.txt ]; then
            echo "❌ dist/llms-full.txt missing — build is broken"; exit 1
          fi
          bytes=$(wc -c < dist/llms-full.txt | tr -d ' ')
          echo "📄 dist/llms-full.txt = ${bytes} bytes"
          if [ "$bytes" -lt 30720 ]; then
            echo "❌ llms-full.txt is below 30 KB threshold — RAG content likely shrank"; exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
